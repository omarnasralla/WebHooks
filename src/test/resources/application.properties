spring.datasource.url=jdbc:h2:mem:webhooks;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.task.scheduling.enabled=false

webhook.secret=test-webhook-secret-for-unit-tests-only

woocommerce.target-base-url=https://b.example.test
woocommerce.target-consumer-key=ck_test
woocommerce.target-consumer-secret=cs_test
woocommerce.source-base-url=https://a.example.test
woocommerce.source-consumer-key=ck_a
woocommerce.source-consumer-secret=cs_a
woocommerce.source-read-enabled=true

logging.level.org.springframework=WARN
