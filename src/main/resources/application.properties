spring.application.name=webhooks
server.port=${SERVER_PORT:8080}

webhook.secret=${WEBHOOK_SECRET:local-dev-webhook-secret-minimum-length}
webhook.signature-header=${WEBHOOK_SIGNATURE_HEADER:X-WC-Webhook-Signature}
webhook.sync.poll-interval-ms=${WEBHOOK_SYNC_POLL_INTERVAL_MS:2000}
webhook.sync.max-attempts=${WEBHOOK_SYNC_MAX_ATTEMPTS:7}
webhook.sync.base-backoff-seconds=${WEBHOOK_SYNC_BASE_BACKOFF_SECONDS:30}
webhook.sync.stuck-processing-recover-after-seconds=${WEBHOOK_STUCK_RECOVER_SECONDS:600}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/webhooks}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:webhooks}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:webhooks}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Store roots only — the app appends /wp-json/wc/v3/...
woocommerce.target-base-url=${WOOCOMMERCE_TARGET_BASE_URL:https://ttf.cclab.store}
woocommerce.target-consumer-key=${WOOCOMMERCE_TARGET_CONSUMER_KEY:}
woocommerce.target-consumer-secret=${WOOCOMMERCE_TARGET_CONSUMER_SECRET:}
woocommerce.source-base-url=${WOOCOMMERCE_SOURCE_BASE_URL:https://thetechfreaks.net}
woocommerce.source-consumer-key=${WOOCOMMERCE_SOURCE_CONSUMER_KEY:}
woocommerce.source-consumer-secret=${WOOCOMMERCE_SOURCE_CONSUMER_SECRET:}
woocommerce.source-read-enabled=${WOOCOMMERCE_SOURCE_READ_ENABLED:true}

logging.level.com.webhooks=INFO
